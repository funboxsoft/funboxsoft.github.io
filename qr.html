<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 6/45 QR 당첨 확인</title>
  <style>
    body {
      margin: 0; padding: 20px; background: #0b0f19; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 92vh; text-align: center; user-select: none;
    }
    h2 { color: #f6cb67; margin: 0 0 8px 0; font-size: 22px; }
    p { color: #cbd5e1; font-size: 14px; margin: 0 0 16px 0; }
    .cam-box {
      position: relative; width: 100%; max-width: 380px; aspect-ratio: 1 / 1;
      border-radius: 18px; overflow: hidden; border: 2px solid #f6cb67; background: #000;
      cursor: pointer;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .guide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 55%; height: 55%; border: 2px dashed rgba(246, 203, 103, 0.9);
      border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45); pointer-events: none;
    }
    .controls {
      display: flex; gap: 10px; margin-top: 14px; width: 100%; max-width: 380px;
    }
    button {
      flex: 1; padding: 12px 8px; border-radius: 12px; border: 1px solid #f6cb67;
      background: #1e293b; color: #f8fafc; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    button:active { background: #334155; }
    #status { margin-top: 14px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>🎰 로또 QR 당첨 확인</h2>
  <p>화면을 터치하면 초점을 다시 맞춥니다.</p>
  
  <div class="cam-box" id="camBox">
    <video id="video" playsinline autoplay muted></video>
    <div class="guide"></div>
  </div>

  <div class="controls">
    <button id="btnFocus">🎯 초점 재조정</button>
    <button id="btnZoom">🔍 2배 줌: OFF</button>
    <button id="btnTorch">🔦 플래시</button>
  </div>

  <div id="status">오토포커스 카메라를 준비 중...</div>

  <script>
    const video = document.getElementById("video");
    const camBox = document.getElementById("camBox");
    const statusEl = document.getElementById("status");
    const btnFocus = document.getElementById("btnFocus");
    const btnZoom = document.getElementById("btnZoom");
    const btnTorch = document.getElementById("btnTorch");

    let videoTrack = null;
    let scanning = true;
    let isZoomed = false;
    let isTorchOn = false;

    // 강제 연속 오토포커스 적용 함수
    async function triggerAutoFocus() {
      if (!videoTrack) return;
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.focusMode) {
          // single-shot으로 먼저 초점을 한 번 당긴 뒤 continuous로 전환
          if (caps.focusMode.includes("single-shot")) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: "single-shot" }] });
          }
          if (caps.focusMode.includes("continuous")) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
          }
          statusEl.innerText = "🎯 자동 초점 작동 중 (15cm 거리 권장)";
        }
      } catch (e) {
        console.log("초점 제어 미지원 브라우저:", e);
      }
    }

    async function startScanner() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        await video.play();

        // 카메라 켜진 직후 오토포커스 강제 활성화
        await triggerAutoFocus();

        // 안드로이드 내장 하드웨어 QR 감지기 실행
        if ("BarcodeDetector" in window) {
          const detector = new BarcodeDetector({ formats: ["qr_code"] });
          const scanLoop = async () => {
            if (!scanning) return;
            try {
              const barcodes = await detector.detect(video);
              if (barcodes.length > 0 && barcodes[0].rawValue) {
                scanning = false;
                const url = barcodes[0].rawValue;
                statusEl.innerText = "✅ 인식 완료! 당첨 결과로 이동합니다...";
                stream.getTracks().forEach(t => t.stop());
                window.location.href = url;
                return;
              }
            } catch (e) {}
            requestAnimationFrame(scanLoop);
          };
          requestAnimationFrame(scanLoop);
        } else {
          statusEl.innerText = "크롬 또는 삼성 인터넷 브라우저에서 열어주세요.";
        }
      } catch (err) {
        statusEl.innerText = "카메라 권한을 허용해 주세요: " + err.message;
      }
    }

    // 1. 카메라 화면이나 [초점 재조정] 버튼 터치 시 즉시 초점 재설정
    camBox.addEventListener("click", triggerAutoFocus);
    btnFocus.addEventListener("click", triggerAutoFocus);

    // 2. [2배 줌] 버튼 (폰을 너무 가까이 대서 흐려지는 현상 방지)
    btnZoom.addEventListener("click", async () => {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.zoom) {
        isZoomed = !isZoomed;
        const targetZoom = isZoomed ? Math.min(2.0, caps.zoom.max) : caps.zoom.min;
        await videoTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
        btnZoom.innerText = isZoomed ? "🔍 2배 줌: ON" : "🔍 2배 줌: OFF";
        await triggerAutoFocus();
      } else {
        statusEl.innerText = "이 기기는 웹 줌 기능을 지원하지 않습니다.";
      }
    });

    // 3. [플래시] 버튼 (어두운 실내 인식률 향상)
    btnTorch.addEventListener("click", async () => {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.torch) {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        btnTorch.innerText = isTorchOn ? "🔦 플래시: ON" : "🔦 플래시";
      } else {
        statusEl.innerText = "이 기기는 웹 플래시 제어를 지원하지 않습니다.";
      }
    });

    startScanner();
  </script>
</body>
</html>
