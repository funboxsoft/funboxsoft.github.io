<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 QR 당첨 확인</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body {
      margin: 0; padding: 20px; background: #0f172a; color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 90vh; text-align: center;
    }
    h2 { color: #f6cb67; margin-bottom: 8px; }
    p { color: #cbd5e1; font-size: 15px; margin-bottom: 20px; }
    #reader {
      width: 100%; max-width: 400px; border-radius: 16px; overflow: hidden;
      border: 2px solid #f6cb67; background: #000;
    }
    #status { margin-top: 16px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>🎰 로또 6/45 QR 당첨 확인</h2>
  <p>로또 용지 상단의 QR 코드를 사각형 안에 비춰주세요.</p>
  <div id="reader"></div>
  <div id="status">후면 카메라를 준비하고 있습니다...</div>

  <script>
    const statusEl = document.getElementById("status");
    const html5QrCode = new Html5Qrcode("reader");

    // 후면 카메라(environment) 강제 지정
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (decodedText) => {
        statusEl.innerText = "인식 완료! 당첨 결과 페이지로 이동합니다...";
        html5QrCode.stop().then(() => {
          window.location.href = decodedText;
        });
      },
      () => {}
    ).then(() => {
      statusEl.innerText = "후면 카메라 작동 중 (QR 코드를 비춰주세요)";
    }).catch((err) => {
      statusEl.innerText = "카메라 권한을 허용해 주세요: " + err;
    });
  </script>
</body>
</html>
