<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>로또 6/45 QR 당첨 확인</title>
  <!-- 내장 감지기 미지원/지연 시 즉시 백업 작동하는 초경량 QR 디코더 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      user-select: none; -webkit-tap-highlight-color: transparent;
    }
    /* 화면 전체를 꽉 채우는 카메라 뷰 */
    #video {
      position: fixed; inset: 0;
      width: 100vw; height: 100dvh;
      object-fit: cover; z-index: 1;
    }
    /* 어두운 반투명 마스크와 중앙 스캔 가이드 */
    .overlay {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 28px 16px 32px 16px;
      pointer-events: none;
    }
    .top-info {
      background: rgba(11, 15, 25, 0.72);
      backdrop-filter: blur(6px);
      padding: 12px 20px; border-radius: 16px;
      border: 1px solid rgba(246, 203, 103, 0.5);
      text-align: center;
    }
    .top-info h2 { color: #f6cb67; font-size: 18px; margin-bottom: 4px; }
    .top-info p { color: #e2e8f0; font-size: 13px; }

    /* 중앙 QR 조준 사각형 (화면 너비의 68%로 큼직하게 배치) */
    .scan-frame {
      position: relative;
      width: 68vw; max-width: 310px; aspect-ratio: 1 / 1;
      border-radius: 20px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52);
      border: 2.5px solid #f6cb67;
    }
    /* 스캔 레이저 라인 애니메이션 */
    .scan-line {
      position: absolute; left: 6%; right: 6%; height: 2px;
      background: linear-gradient(90deg, transparent, #f6cb67, transparent);
      box-shadow: 0 0 8px #f6cb67;
      animation: scanMove 2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0%, 100% { top: 10%; }
      50% { top: 88%; }
    }

    .bottom-panel {
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      pointer-events: auto;
    }
    #status {
      background: rgba(11, 15, 25, 0.78);
      padding: 8px 16px; border-radius: 20px;
      font-size: 13px; color: #f8fafc;
    }
    .controls {
      display: flex; gap: 10px; width: 100%;
    }
    button {
      flex: 1; padding: 14px 8px; border-radius: 14px;
      border: 1px solid rgba(246, 203, 103, 0.7);
      background: rgba(15, 23, 42, 0.85); color: #fff;
      font-size: 14px; font-weight: bold; cursor: pointer;
    }
    button:active { background: #334155; transform: scale(0.97); }
    canvas { display: none; }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="cropCanvas"></canvas>

  <div class="overlay" id="touchArea">
    <div class="top-info">
      <h2>🎰 로또 QR 당첨 확인</h2>
      <p>사각형 안에 QR 코드를 맞추세요 (터치 시 재초점)</p>
    </div>

    <div class="scan-frame">
      <div class="scan-line"></div>
    </div>

    <div class="bottom-panel">
      <div id="status">고화질 카메라 연결 중...</div>
      <div class="controls">
        <button id="btnFocus">🎯 초점 맞춤</button>
        <button id="btnZoom">🔍 줌: 1.8x</button>
        <button id="btnTorch">🔦 플래시</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("cropCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const statusEl = document.getElementById("status");
    const btnFocus = document.getElementById("btnFocus");
    const btnZoom = document.getElementById("btnZoom");
    const btnTorch = document.getElementById("btnTorch");

    let videoTrack = null;
    let scanning = true;
    let zoomLevel = 1.8;
    let isTorchOn = false;

    // 오토포커스 강제 실행
    async function triggerAutoFocus() {
      if (!videoTrack) return;
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.focusMode) {
          if (caps.focusMode.includes("single-shot")) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: "single-shot" }] });
          }
          if (caps.focusMode.includes("continuous")) {
            await videoTrack.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
          }
          statusEl.innerText = "🎯 초점 재조정 완료 (15~20cm 거리 유지)";
        }
      } catch (e) {}
    }

    // 줌 배율 적용
    async function applyZoom(target) {
      if (!videoTrack) return;
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.zoom) {
          const clamped = Math.max(caps.zoom.min, Math.min(target, caps.zoom.max));
          await videoTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
          btnZoom.innerText = `🔍 줌: ${clamped.toFixed(1)}x`;
        }
      } catch (e) {}
    }

    function handleDetected(rawUrl, stream) {
      if (!scanning) return;
      scanning = false;
      statusEl.innerText = "✅ 인식 성공! 동행복권 결과로 이동합니다...";
      if (navigator.vibrate) navigator.vibrate(60);
      stream.getTracks().forEach(t => t.stop());
      window.location.href = rawUrl;
    }

    async function startScanner() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        await video.play();

        // 시작 시 1.8배 줌 + 연속 오토포커스 자동 적용
        await applyZoom(1.8);
        await triggerAutoFocus();
        statusEl.innerText = "📷 QR 코드를 노란 사각형 안에 비춰주세요";

        const hasNativeDetector = ("BarcodeDetector" in window);
        const detector = hasNativeDetector ? new BarcodeDetector({ formats: ["qr_code"] }) : null;

        // 중앙 영역만 정밀 크롭하여 고속 스캔 루프 실행
        const scanLoop = async () => {
          if (!scanning) return;

          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            // 화면 중앙 정사각형(짧은 변의 60%) 영역만 잘라내어 해상도 손실 없이 분석
            const cropSize = Math.floor(Math.min(vw, vh) * 0.6);
            const sx = Math.floor((vw - cropSize) / 2);
            const sy = Math.floor((vh - cropSize) / 2);

            canvas.width = 600;
            canvas.height = 600;
            ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 600, 600);

            // 1차: 브라우저 내장 하드웨어 감지기
            if (detector) {
              try {
                const codes = await detector.detect(canvas);
                if (codes.length > 0 && codes[0].rawValue) {
                  handleDetected(codes[0].rawValue, stream);
                  return;
                }
              } catch (e) {}
            }

            // 2차: jsQR 소프트웨어 정밀 디코더 동시 실행 (작은 코드 인식 보완)
            if (window.jsQR) {
              const imgData = ctx.getImageData(0, 0, 600, 600);
              const qr = jsQR(imgData.data, 600, 600, { inversionAttempts: "dontInvert" });
              if (qr && qr.data) {
                handleDetected(qr.data, stream);
                return;
              }
            }
          }
          setTimeout(() => requestAnimationFrame(scanLoop), 80);
        };

        requestAnimationFrame(scanLoop);
      } catch (err) {
        statusEl.innerText = "카메라 권한을 허용해 주세요: " + err.message;
      }
    }

    // 화면 아무 곳이나 터치 시 즉시 초점 재조정
    video.addEventListener("click", triggerAutoFocus);
    btnFocus.addEventListener("click", triggerAutoFocus);

    // 줌 버튼 순환 (1.0x -> 1.8x -> 2.5x)
    btnZoom.addEventListener("click", async () => {
      zoomLevel = (zoomLevel === 1.8) ? 2.5 : (zoomLevel === 2.5 ? 1.0 : 1.8);
      await applyZoom(zoomLevel);
      await triggerAutoFocus();
    });

    // 플래시 토글
    btnTorch.addEventListener("click", async () => {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (caps.torch) {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
        btnTorch.innerText = isTorchOn ? "🔦 플래시: ON" : "🔦 플래시";
      } else {
        statusEl.innerText = "이 브라우저는 플래시 제어를 지원하지 않습니다.";
      }
    });

    startScanner();
  </script>
</body>
</html>
